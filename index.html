<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlier 6 Promo Square</title>
<style>
  :root { --graphite: #111112; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--graphite); }
  body { display: grid; place-items: center; min-height: 100vh; }
  /* video plays on its own, muted, in a loop (works on iPhone too) */
  .bd-video { position: relative; width: 100%; max-width: min(100vw, 100vh); aspect-ratio: 1 / 1; overflow: hidden; background: #000; }
  .bd-video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<!-- For the website: upload outlier-6-promo-square.mp4 and outlier-6-promo-square-poster.jpg, then replace the two file names below with their links. -->
<section class="bd-video" aria-label="Outlier 6 Promo Square">
  <video autoplay muted loop playsinline preload="auto" poster="outlier-6-promo-square-poster.jpg">
    <source src="outlier-6-promo-square.mp4" type="video/mp4">
  </video>
</section>
</body>
</html>
